[package]
name = "ORB_SLAM2"
version = "1.0.0"
cxx-standard = "c++20"
c-standard = "c11"          # g2o/stuff/os_specific.c

[dependencies]
# System deps are package-wide: pkg-config cflags/ldflags reach every target,
# so they are never listed in a target's `deps`.
opencv4 = { version = ">=4.0", system = true }
eigen3 = { version = ">=3.1.0", system = true }
# GUI deps for orbslam2_viewer. Harmless for the library targets: pkg-config
# cflags/ldflags are package-wide and neither library #includes GL or GLFW.
glfw3 = { version = ">=3.3", system = true }
gl = { version = ">=1.2", system = true }

[dev-dependencies]
gmock_main = { version = ">=1.10", system = true }

# -Wall everywhere; CMake put it on the ORB_SLAM2 library only, but target-scoped flags
# do not exist in cabin and Thirdparty is already warning-clean enough.
[profile]
cxxflags = ["-Wall", "-Wextra"]

# Replaces -DORBSLAM2_NATIVE_ARCH=ON. -march=native raises EIGEN_MAX_ALIGN_BYTES
# (16 -> 64 on AVX-512), which changes the size/alignment of Eigen-containing
# types such as g2o::SE3Quat. A profile applies to the whole build, so DBoW2,
# g2o and the two orbslam2 libraries cannot disagree -- which is what used to segfault in g2o.
[profile.native]
inherits = "release"
cflags = ["-march=native"]
cxxflags = ["-march=native"]

[target.DBoW2]
type = "library"
include-dirs = ["Thirdparty/DBoW2"]
sources = [
  "Thirdparty/DBoW2/DBoW2/BowVector.cpp",
  "Thirdparty/DBoW2/DBoW2/FORB.cpp",
  "Thirdparty/DBoW2/DBoW2/FeatureVector.cpp",
  "Thirdparty/DBoW2/DBoW2/ScoringObject.cpp",
  "Thirdparty/DBoW2/DUtils/Random.cpp",
  "Thirdparty/DBoW2/DUtils/Timestamp.cpp",
]

[target.g2o]
type = "library"
include-dirs = ["Thirdparty/g2o"]
defines = ["UNIX"]
sources = [
  "Thirdparty/g2o/g2o/types/types_sba.cpp",
  "Thirdparty/g2o/g2o/types/types_six_dof_expmap.cpp",
  "Thirdparty/g2o/g2o/types/types_seven_dof_expmap.cpp",
  "Thirdparty/g2o/g2o/core/hyper_graph_action.cpp",
  "Thirdparty/g2o/g2o/core/hyper_graph.cpp",
  "Thirdparty/g2o/g2o/core/marginal_covariance_cholesky.cpp",
  "Thirdparty/g2o/g2o/core/matrix_structure.cpp",
  "Thirdparty/g2o/g2o/core/batch_stats.cpp",
  "Thirdparty/g2o/g2o/core/parameter.cpp",
  "Thirdparty/g2o/g2o/core/cache.cpp",
  "Thirdparty/g2o/g2o/core/optimizable_graph.cpp",
  "Thirdparty/g2o/g2o/core/solver.cpp",
  "Thirdparty/g2o/g2o/core/optimization_algorithm_factory.cpp",
  "Thirdparty/g2o/g2o/core/estimate_propagator.cpp",
  "Thirdparty/g2o/g2o/core/factory.cpp",
  "Thirdparty/g2o/g2o/core/sparse_optimizer.cpp",
  "Thirdparty/g2o/g2o/core/hyper_dijkstra.cpp",
  "Thirdparty/g2o/g2o/core/parameter_container.cpp",
  "Thirdparty/g2o/g2o/core/optimization_algorithm.cpp",
  "Thirdparty/g2o/g2o/core/optimization_algorithm_with_hessian.cpp",
  "Thirdparty/g2o/g2o/core/optimization_algorithm_levenberg.cpp",
  "Thirdparty/g2o/g2o/core/jacobian_workspace.cpp",
  "Thirdparty/g2o/g2o/core/robust_kernel.cpp",
  "Thirdparty/g2o/g2o/core/robust_kernel_factory.cpp",
  "Thirdparty/g2o/g2o/core/robust_kernel_impl.cpp",
  "Thirdparty/g2o/g2o/stuff/timeutil.cpp",
  "Thirdparty/g2o/g2o/stuff/os_specific.c",
  "Thirdparty/g2o/g2o/stuff/string_tools.cpp",
  "Thirdparty/g2o/g2o/stuff/property.cpp",
]

# Dear ImGui v1.91.5, vendored: it ships no pkg-config file and is a source drop by
# design. Backends are the upstream GLFW + OpenGL3 ones, not hand-written.
[target.imgui]
type = "library"
include-dirs = ["Thirdparty/imgui", "Thirdparty/imgui/backends"]
sources = [
  "Thirdparty/imgui/imgui.cpp",
  "Thirdparty/imgui/imgui_draw.cpp",
  "Thirdparty/imgui/imgui_tables.cpp",
  "Thirdparty/imgui/imgui_widgets.cpp",
  "Thirdparty/imgui/backends/imgui_impl_glfw.cpp",
  "Thirdparty/imgui/backends/imgui_impl_opengl3.cpp",
]

[target.orbslam2_core]
# Data structures + feature front-end. Cyclic between themselves (Frame needs
# ORBextractor, ORBmatcher needs Frame), so they are one target; everything
# above them is not, which is the whole point of the split.
type = "library"
# "." is public: public headers include "Thirdparty/g2o/g2o/...".
include-dirs = [".", "include"]
deps = [
  { name = "DBoW2", public = true },
  { name = "g2o", public = true },
]
sources = [
  "src/core/Converter.cpp",
  "src/core/Map.cpp",
  "src/core/MapPoint.cpp",
  "src/core/KeyFrame.cpp",
  "src/core/Frame.cpp",
  "src/features/ORBextractor.cpp",
  "src/features/ORBmatcher.cpp",
  "src/features/KeyFrameDatabase.cpp",
]

[target.orbslam2_slam]
# The SLAM threads and the public System facade. Depends on core, never the
# reverse -- that direction is the invariant this split exists to enforce.
type = "library"
include-dirs = [".", "include"]
deps = [{ name = "orbslam2_core", public = true }]
sources = [
  "src/tracking/Initializer.cpp",
  "src/tracking/Tracking.cpp",
  "src/mapping/LocalMapping.cpp",
  "src/loop_closing/LoopClosing.cpp",
  "src/optimization/Optimizer.cpp",
  "src/optimization/PnPsolver.cpp",
  "src/optimization/Sim3Solver.cpp",
  "src/system/System.cpp",
]

[target.rgbd_tum]
type = "executable"
sources = ["Examples/RGB-D/rgbd_tum.cpp"]
defines = ["COMPILEDWITHC11"]
deps = ["orbslam2_slam"]

[target.stereo_kitti]
type = "executable"
sources = ["Examples/Stereo/stereo_kitti.cpp"]
defines = ["COMPILEDWITHC11"]
deps = ["orbslam2_slam"]

[target.stereo_euroc]
type = "executable"
sources = ["Examples/Stereo/stereo_euroc.cpp"]
defines = ["COMPILEDWITHC11"]
deps = ["orbslam2_slam"]

[target.mono_tum]
type = "executable"
sources = ["Examples/Monocular/mono_tum.cpp"]
defines = ["COMPILEDWITHC11"]
deps = ["orbslam2_slam"]

[target.mono_kitti]
type = "executable"
sources = ["Examples/Monocular/mono_kitti.cpp"]
defines = ["COMPILEDWITHC11"]
deps = ["orbslam2_slam"]

[target.mono_euroc]
type = "executable"
sources = ["Examples/Monocular/mono_euroc.cpp"]
defines = ["COMPILEDWITHC11"]
deps = ["orbslam2_slam"]

# The GLFW/OpenGL/ImGui visualizer. A separate executable on purpose: the core
# libraries stay headless and know nothing about GL. --headless runs the same
# dataset loop with no window.
[target.orbslam2_viewer]
type = "executable"
include-dirs = [".", "include", "apps/viewer"]
sources = [
  "apps/viewer/main.cpp",
  "apps/viewer/Snapshot.cpp",
  "apps/viewer/Viewer.cpp",
]
deps = ["orbslam2_slam", "imgui"]

# One binary for all tests: 16 link steps against orbslam2_slam for no gain.
[target.orbslam2_tests]
type = "test"
include-dirs = ["tests", "apps/viewer"]
deps = ["orbslam2_slam"]
sources = [
  "tests/converter_test.cpp",
  "tests/map_test.cpp",
  "tests/mappoint_test.cpp",
  "tests/keyframe_test.cpp",
  "tests/frame_test.cpp",
  "tests/orbextractor_test.cpp",
  "tests/orbmatcher_test.cpp",
  "tests/initializer_test.cpp",
  "tests/pnpsolver_test.cpp",
  "tests/sim3solver_test.cpp",
  "tests/optimizer_test.cpp",
  "tests/keyframedatabase_test.cpp",
  "tests/localmapping_test.cpp",
  "tests/loopclosing_test.cpp",
  "tests/tracking_test.cpp",
  "tests/system_test.cpp",
  "tests/snapshot_test.cpp",
  "apps/viewer/Snapshot.cpp",
]
